<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento - Yu-Gi-Oh! Templo de Duelo</title>
    <style>
        @font-face {
            font-family: 'YuGiOhFont';
            src: url('./fuentes/Matrix-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-principal: #8D3824;
            --bg-header: rgba(60, 20, 10, 0.95);
            --bg-tarjeta: #3c140a;
            --color-dorado: #f3c653;
            --color-blanco: #ffffff;
            --fuente-principal: 'YuGiOhFont', Arial, sans-serif;
            --sombra-texto: 1px 1px 2px rgba(0,0,0,0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background-color: var(--bg-principal);
            color: var(--color-dorado);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: var(--fuente-principal);
        }

        /* --- BEM: Bloque Header --- */
        .mantenimiento-header {
            width: 100%;
            background-color: var(--bg-header);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mantenimiento-header__logo {
            height: 45px;
        }

        .mantenimiento-header__link {
            color: var(--color-dorado);
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            text-shadow: var(--sombra-texto);
            transition: color 0.2s ease;
        }

        /* 1. PSEUDOCLASE: :hover para los enlaces del menú */
        .mantenimiento-header__link:hover {
            color: var(--color-blanco);
            text-decoration: underline;
        }

        /* --- BEM: Bloque Main --- */
        .mantenimiento-main {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- BEM: Bloque Aviso --- */
        .mantenimiento-aviso {
            background-color: var(--bg-tarjeta);
            border: 3px solid #200803;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: var(--color-dorado);
            font-size: 1.5rem;
            line-height: 1.6;
            letter-spacing: 1px;
            margin-bottom: 30px;
            position: relative; /* Necesario para posicionar el pseudoelemento */
            overflow: hidden;
        }

        /* 2. PSEUDOELEMENTO: ::before para crear una línea decorativa superior */
        .mantenimiento-aviso::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: var(--color-dorado);
        }

        .mantenimiento-main__logo-small {
            width: 250px;
            background-color: var(--bg-tarjeta);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #5a2412;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* --- BEM: Bloque Footer --- */
        .mantenimiento-footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            color: var(--color-dorado);
            background-color: var(--bg-header);
        }
    </style>
</head>
<body>

    <header class="mantenimiento-header">
        <a href="index.html"><img src="./imagenes/logo.png" alt="Yu-Gi-Oh!" class="mantenimiento-header__logo"></a>
        <nav>
            <a href="cartas.html" class="mantenimiento-header__link">CARTAS</a>
            <a href="duelos.html" class="mantenimiento-header__link">DUELOS</a>
            <a href="sucursal.html" class="mantenimiento-header__link">SUCURSAL</a>
            <a href="registro.html" class="mantenimiento-header__link">Registrarse / Iniciar sesión</a>
        </nav>
    </header>

    <main class="mantenimiento-main">
        <div class="mantenimiento-aviso">
            Lo sentimos, el modo duelos aleatorio está de momento en mantenimiento.<br>
            Por favor vuelva a la página principal o entre al menú de <strong>DUELOS</strong>.
        </div>

        <img src="./imagenes/logo.png" alt="Yu-Gi-Oh! Templo de Duelos" class="mantenimiento-main__logo-small">
    </main>

    <footer class="mantenimiento-footer">
        <p>&copy; 2026 Yu-Gi-Oh! Templo de Duelo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
