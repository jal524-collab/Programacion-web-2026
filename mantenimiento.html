<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento - Yu-Gi-Oh! Templo de Duelo</title>
    <style>
        @font-face {
            font-family: 'YuGiOhFont';
            src: url('./fuentes/Matrix-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-principal: #8D3824;
            --bg-header: rgba(60, 20, 10, 0.95);
            --bg-tarjeta: #3c140a;
            --color-dorado: #f3c653;
            --color-blanco: #ffffff;
            --fuente-principal: 'YuGiOhFont', Arial, sans-serif;
            --sombra-texto: 1px 1px 2px rgba(0,0,0,0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-principal);
            color: var(--color-dorado);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: var(--fuente-principal);
        }

        header {
            width: 100%;
            background-color: var(--bg-header);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-nav {
            height: 45px;
        }

        nav a {
            color: var(--color-dorado);
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            text-shadow: var(--sombra-texto);
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .maintenance-box {
            background-color: var(--bg-tarjeta);
            border: 3px solid #200803;
            padding: 40px;
            text-align: center;
            font-size: 1.5rem;
            line-height: 1.6; /* Formato de texto */
            margin-bottom: 30px;
            letter-spacing: 1px; /* Formato de texto */
            color: var(--color-dorado);
        }

        .main-logo-small {
            width: 250px;
            background-color: var(--bg-tarjeta);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #5a2412;
        }

        footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            color: var(--color-dorado);
            background-color: var(--bg-header);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><img src="./imagenes/logo.png" alt="Yu-Gi-Oh!" class="logo-nav"></a>
        <nav>
            <a href="cartas.html">CARTAS</a>
            <a href="duelos.html">DUELOS</a>
            <a href="sucursal.html">SUCURSAL</a>
            <a href="registro.html">Registrarse / Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <div class="maintenance-box">
            Lo sentimos, el modo duelos aleatorio está de momento en mantenimiento.<br>
            Por favor vuelva a la página principal o entre al menú de <strong>DUELOS</strong>.
        </div>

        <img src="./imagenes/logo.png" alt="Yu-Gi-Oh! Templo de Duelos" class="main-logo-small">
    </main>

    <footer>
        <p>&copy; 2026 Yu-Gi-Oh! Templo de Duelo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
