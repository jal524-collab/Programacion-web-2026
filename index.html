<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Yu-Gi-Oh! Templo de Duelo">
    <meta name="description" content="Lucha con duelistas en línea y descubre sucursales cerca de tu área. Explora cartas de Yu-Gi-Oh en nuestro sitio web.">
    <title>Yu-Gi-Oh Templo de Duelo</title>
    <meta property="og:description" content="Busca duelos en línea y descubre cartas de Yu-Gi-Oh! en nuestro sitio web.">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://www.yugiohtemplodeduelos.com/inicio/menu">
    <link rel="alternate" hreflang="es" href="https://www.yugiohtemplodeduelos.com/es/">
    <link rel="alternate" hreflang="en" href="https://www.yugiohtemplodeduelos.com/en/">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            color: #f3c653;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Barra de navegacion superior */
        header {
            width: 100%;
            background-color: rgba(60, 20, 10, 0.9);
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #5a1f12;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .logo-nav {
            height: 40px;
            width: auto;
        }

        nav a {
            color: #f3c653;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Contenido Principal */
        main {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            flex-grow: 1;
            justify-content: center;
        }

        .hero-content {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #f3c653;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
        }

        .main-logo {
            max-width: 350px;
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(2px 2px 8px rgba(0,0,0,0.6));
        }

        /* Seccion decorativa de Monstruos inferiores */
        .monsters-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
            width: 100%;
        }

        .monster-img {
            max-height: 140px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.7));
            transition: transform 0.3s ease;
        }

        .monster-img:hover {
            transform: scale(1.08);
        }

        /* Boton de Duelo interactivo */
        .btn-duelo {
            display: inline-block;
            margin-top: 15px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn-duelo:hover {
            transform: scale(1.06);
            filter: brightness(1.1);
        }

        .btn-duelo img {
            max-width: 280px;
            width: 100%;
            height: auto;
        }

        /* Pie de pagina */
        footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #fff;
            background-color: rgba(30, 10, 5, 0.8);
            border-top: 1px solid #5a1f12;
        }

        /* Disenio Responsivo basico para celulares */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 10px;
            }
            nav a {
                margin: 0 10px;
                font-size: 0.85rem;
            }
            h1 {
                font-size: 2rem;
            }
            .monster-img {
                max-height: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- Barra de navegacion superior -->
    <header>
        <div>
            <a href="index.html">
                <img src="imagenes/logo.png" alt="Yu-Gi-Oh! Templo de Duelo" class="logo-nav">
            </a>
        </div>
        <nav>
            <a href="cartas.html">CARTAS</a>
            <a href="duelos.html">DUELOS</a>
            <a href="sucursal.html">SUCURSAL</a>
            <a href="registro.html">Registrarse / Iniciar sesion</a>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main>
        <div class="hero-content">
            <h1>Yu-Gi-Oh! Templo de Duelo</h1>
            <!-- Imagen principal del logo -->
            <img src="imagenes/logo.png" alt="Logotipo oficial de Yu-Gi-Oh! Templo de Duelos" class="main-logo">
        </div>

        <!-- Fila de monstruos decorativos -->
        <div class="monsters-container">
            <img src="imagenes/monstruo1.png" alt="Monstruo de Yu-Gi-Oh!" class="monster-img">
            <img src="imagenes/monstruo2.jpg" alt="Monstruo de Yu-Gi-Oh!" class="monster-img">
            <img src="imagenes/monstruo3.jpg" alt="Monstruo de Yu-Gi-Oh!" class="monster-img">
            <img src="imagenes/monstruo4.jpg" alt="Monstruo de Yu-Gi-Oh!" class="monster-img">
        </div>

        <!-- Enlace troll -->
        <div class="btn-duelo">
            <a href="https://www.youtube.com/shorts/3TBl4PWTpF0" target="_blank" rel="noopener noreferrer">
                <img src="imagenes/unirse_duelo.png" alt="Botón para unirse a un duelo de Yu-Gi-Oh!">
            </a>
        </div>
    </main>

    <!-- Pie de pagina -->
    <footer>
        <p>&copy; 2026 Yu-Gi-Oh! Templo de Duelo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
