<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Yu-Gi-Oh! Templo de Duelo">
    <meta name="description" content="Lucha con duelistas en línea y descubre sucursales cerca de tu área. Explora cartas de Yu-Gi-Oh en nuestro sitio web.">
    <title>Yu-Gi-Oh Templo de Duelo</title>
    <meta property="og:description" content="Busca duelos en línea y descubre cartas de Yu-Gi-Oh! en nuestro sitio web.">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://www.yugiohtemplodeduelos.com/inicio/menu">
    <link rel="alternate" hreflang="es" href="https://www.yugiohtemplodeduelos.com/es/">
    <link rel="alternate" hreflang="en" href="https://www.yugiohtemplodeduelos.com/en/">
    
    <style>
        @font-face {
            font-family: 'YuGiOhFont';
            src: url('./fuentes/Matrix-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-principal: #8D3824;
            --bg-header: rgba(90, 40, 20, 0.95);
            --bg-tarjeta: #3c140a;
            --color-dorado: #f3c653;
            --color-texto-base: #4a2511;
            --fuente-principal: 'YuGiOhFont', Arial, sans-serif;
            --sombra-texto: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* COMPONENTES REPETIBLES */
        .componente-tarjeta {
            background-color: var(--bg-tarjeta);
            border: 3px solid #200803;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .componente-boton {
            background-color: #3c140a;
            color: var(--color-dorado);
            padding: 14px 28px;
            border-radius: 8px;
            border: 2px solid #5a2412;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .componente-boton:hover {
            background-color: #5a2412;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        .componente-aviso {
            background-color: var(--bg-tarjeta);
            border: 3px solid #200803;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: var(--color-dorado);
            letter-spacing: 1px;
        }

        /* Estilos generales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-principal);
            color: var(--color-texto-base);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: var(--fuente-principal);
        }

        header {
            width: 100%;
            background-color: var(--bg-header);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-tarjeta);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-nav {
            height: 45px;
            width: auto;
        }

        nav a {
            color: var(--color-dorado);
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: var(--sombra-texto);
            transition: color 0.2s;
        }

        nav a:hover {
            color: #fff;
            text-decoration: underline;
        }

        main {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            flex-grow: 1;
        }

        h1 {
            font-size: 3rem;
            margin-top: 10px;
            margin-bottom: 25px;
            color: var(--bg-tarjeta);
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            line-height: 1.2;
        }

        #titulo-principal {
            font-weight: bold;
            text-transform: uppercase;
        }

        .main-logo {
            max-width: 450px;
            width: 100%;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.3));
        }

        .monsters-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0 30px 0;
            width: 100%;
        }

        .monster-img {
            max-height: 150px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .monster-img:hover {
            transform: scale(1.08);
        }

        footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--color-dorado);
            background-color: var(--bg-header);
            border-top: 1px solid var(--bg-tarjeta);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                padding: 10px;
            }
            nav a {
                margin: 0 8px;
                font-size: 0.9rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .monster-img {
                max-height: 100px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <a href="index.html">
                <img src="./imagenes/logo.png" alt="Yu-Gi-Oh! Templo de Duelo" class="logo-nav">
            </a>
        </div>
        <nav>
            <a href="cartas.html">CARTAS</a>
            <a href="duelos.html">DUELOS</a>
            <a href="sucursal.html">SUCURSAL</a>
            <a href="registro.html">Registrarse / Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <h1 id="titulo-principal">Yu-Gi-Oh! Templo de Duelo</h1>
        
        <img src="./imagenes/logo.png" alt="Logotipo oficial" class="main-logo">

        <div class="monsters-container">
            <img src="./imagenes/monstruo1.png" alt="Monstruo 1" class="monster-img">
            <img src="./imagenes/monstruo2.png" alt="Monstruo 2" class="monster-img">
            <img src="./imagenes/monstruo3.png" alt="Monstruo 3" class="monster-img">
            <img src="./imagenes/monstruo4.png" alt="Monstruo 4" class="monster-img">
        </div>

        <a href="https://www.youtube.com/shorts/3TBl4PWTpF0" target="_blank" rel="noopener noreferrer" class="componente-boton">
            Unirse a un duelo
        </a>
    </main>

    <footer>
        <p>&copy; 2026 Yu-Gi-Oh! Templo de Duelo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
