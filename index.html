<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Yu-Gi-Oh! Templo de Duelo">
    <meta name="description" content="Lucha con duelistas en línea y descubre sucursales cerca de tu área. Explora cartas de Yu-Gi-Oh en nuestro sitio web.">
    <title>Yu-Gi-Oh Templo de Duelo</title>
    <meta property="og:description" content="Busca duelos en línea y descubre cartas de Yu-Gi-Oh! en nuestro sitio web.">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://www.yugiohtemplodeduelos.com/inicio/menu">
    <link rel="alternate" hreflang="es" href="https://www.yugiohtemplodeduelos.com/es/">
    <link rel="alternate" hreflang="en" href="https://www.yugiohtemplodeduelos.com/en/">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #8D3824;
            color: #4a2511;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Barra de navegacion superior */
        header {
            width: 100%;
            background-color: rgba(90, 40, 20, 0.95);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3c140a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-nav {
            height: 45px;
            width: auto;
        }

        nav a {
            color: #f3c653;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            transition: color 0.2s;
        }

        nav a:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Contenido Principal */
        main {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            flex-grow: 1;
        }

        h1 {
            font-size: 3rem;
            margin-top: 10px;
            margin-bottom: 25px;
            color: #3c140a;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        .main-logo {
            max-width: 450px;
            width: 100%;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.3));
        }

        /* Contenedor de Monstruos */
        .monsters-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0 30px 0;
            width: 100%;
        }

        .monster-img {
            max-height: 150px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .monster-img:hover {
            transform: scale(1.08);
        }

        /* Boton de Duelo */
        .btn-duelo {
            display: inline-block;
            background-color: #3c140a;
            color: #f3c653;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            border: 2px solid #5a2412;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .btn-duelo:hover {
            background-color: #5a2412;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }

        /* Pie de pagina */
        footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #f3c653;
            background-color: rgba(60, 20, 10, 0.95);
            border-top: 1px solid #3c140a;
        }

        /* Responsivo para celulares */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                padding: 10px;
            }
            nav a {
                margin: 0 8px;
                font-size: 0.9rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .monster-img {
                max-height: 100px;
            }
            .btn-duelo {
                font-size: 1rem;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Barra de navegacion superior -->
    <header>
        <div>
            <a href="index.html">
                <img src="./imagenes/logo.png" alt="Yu-Gi-Oh! Templo de Duelo" class="logo-nav">
            </a>
        </div>
        <nav>
            <a href="cartas.html">CARTAS</a>
            <a href="duelos.html">DUELOS</a>
            <a href="sucursal.html">SUCURSAL</a>
            <a href="registro.html">Registrarse / Iniciar sesión</a>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main>
        <h1>Yu-Gi-Oh! Templo de Duelo</h1>
        
        <!-- Imagen principal del logo -->
        <img src="./imagenes/logo.png" alt="Logotipo oficial de Yu-Gi-Oh! Templo de Duelos" class="main-logo">

        <!-- Fila de monstruos decorativos -->
        <div class="monsters-container">
            <img src="./imagenes/monstruo1.png" alt="Monstruo de Yu-Gi-Oh!" class="monster-img">
            <img src="./imagenes/monstruo2.png" alt="Monstruo de Yu-Gi-Oh!" class="monster-img">
            <img src="./imagenes/monstruo3.png" alt="Monstruo de Yu-Gi-Oh!" class="monster-img">
            <img src="./imagenes/monstruo4.png" alt="Monstruo de Yu-Gi-Oh!" class="monster-img">
        </div>

        <!-- Boton de duelo troll -->
        <a href="https://www.youtube.com/shorts/3TBl4PWTpF0" target="_blank" rel="noopener noreferrer" class="btn-duelo">
            Unirse a un duelo
        </a>
    </main>

    <!-- Pie de pagina -->
    <footer>
        <p>&copy; 2026 Yu-Gi-Oh! Templo de Duelo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
