<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duelos - Yu-Gi-Oh! Templo de Duelo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #8D3824;
            color: #f3c653;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        header {
            width: 100%;
            background-color: rgba(60, 20, 10, 0.95);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3c140a;
        }
        .logo-nav { height: 45px; }
        nav a { color: #f3c653; text-decoration: none; margin-left: 20px; font-weight: bold; }
        nav a.active { color: #fff; text-decoration: underline; }

        main {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Grilla de Salas */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .room-card {
            background-color: #3c140a;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #5a2412;
        }

        .room-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f3c653;
        }

        .spaces {
            font-size: 0.9rem;
            color: #e0d0b0;
        }

        .btn-unirse {
            background-color: #5a2412;
            color: #f3c653;
            border: none;
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-start;
        }

        .btn-unirse:disabled {
            background-color: #1a0804;
            color: #666;
            cursor: not-allowed;
        }

        .btn-siguiente {
            background-color: #3c140a;
            color: #f3c653;
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #5a2412;
            margin-top: 30px;
        }

        footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            background-color: rgba(60, 20, 10, 0.95);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><img src="./imagenes/logo.png" alt="Yu-Gi-Oh!" class="logo-nav"></a>
        <nav>
            <a href="cartas.html">CARTAS</a>
            <a href="duelos.html" class="active">DUELOS</a>
            <a href="sucursal.html">SUCURSAL</a>
            <a href="registro.html">Registrarse / Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <div class="rooms-grid">
            <div class="room-card">
                <img src="./imagenes/avatar1.jpg" alt="Avatar" class="avatar">
                <div class="room-info">
                    <span class="user-name">MasterMiguel67</span>
                    <span class="spaces">ESPACIOS: 1/2</span>
                    <button class="btn-unirse">UNIRSE</button>
                </div>
            </div>

            <div class="room-card">
                <img src="./imagenes/avatar2.jpg" alt="Avatar" class="avatar">
                <div class="room-info">
                    <span class="user-name">MyDarlingKano</span>
                    <span class="spaces">ESPACIOS: 2/2</span>
                    <button class="btn-unirse" disabled>UNIRSE</button>
                </div>
            </div>
        </div>

        <a href="#" class="btn-siguiente">SIGUIENTE ></a>
    </main>

    <footer>
        <p>&copy; 2026 Yu-Gi-Oh! Templo de Duelo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
