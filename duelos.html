<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duelos - Yu-Gi-Oh! Templo de Duelo</title>
    <style>
        @font-face {
            font-family: 'YuGiOhFont';
            src: url('./fuentes/Matrix-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-principal: #8D3824;
            --bg-header: rgba(60, 20, 10, 0.95);
            --bg-tarjeta: #3c140a;
            --color-dorado: #f3c653;
            --color-texto-suave: #e0d0b0;
            --color-blanco: #ffffff;
            --fuente-principal: 'YuGiOhFont', Arial, sans-serif;
            --sombra-texto: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* COMPONENTES REPETIBLES */
        .componente-tarjeta {
            background-color: var(--bg-tarjeta);
            border: 3px solid #200803;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .componente-boton {
            background-color: #5a2412;
            color: var(--color-dorado);
            padding: 8px 18px;
            border-radius: 12px;
            border: 2px solid #5a2412;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            text-shadow: var(--sombra-texto);
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .componente-boton:hover:not(:disabled) {
            color: var(--color-blanco);
            transform: scale(1.05);
            background-color: #702e17;
        }

        .componente-boton:disabled {
            background-color: #1a0804;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background-color: var(--bg-principal);
            color: var(--color-dorado);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: var(--fuente-principal);
        }

        header {
            width: 100%;
            background-color: var(--bg-header);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-tarjeta);
        }
        .logo-nav { height: 45px; }
        nav a { color: var(--color-dorado); text-decoration: none; margin-left: 20px; font-weight: bold; text-shadow: var(--sombra-texto); }
        nav a.active, nav a:hover { color: var(--color-blanco); text-decoration: underline; }

        main {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #5a2412;
        }

        .room-info { display: flex; flex-direction: column; gap: 8px; }
        .user-name { font-size: 1.1rem; font-weight: bold; color: var(--color-dorado); letter-spacing: 0.5px; }
        .spaces { font-size: 0.9rem; color: var(--color-texto-suave); letter-spacing: 1px; text-transform: uppercase; }

        .btn-siguiente-main {
            background-color: var(--bg-tarjeta);
            color: var(--color-dorado);
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #5a2412;
            margin-top: 30px;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            color: var(--color-dorado);
            background-color: var(--bg-header);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><img src="./imagenes/logo.png" alt="Yu-Gi-Oh!" class="logo-nav"></a>
        <nav>
            <a href="cartas.html">CARTAS</a>
            <a href="duelos.html" class="active">DUELOS</a>
            <a href="sucursal.html">SUCURSAL</a>
            <a href="registro.html">Registrarse / Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <div class="rooms-grid">
            <div class="room-card componente-tarjeta">
                <img src="./imagenes/avatar1.jpg" alt="Avatar" class="avatar">
                <div class="room-info">
                    <span class="user-name">MasterMiguel67</span>
                    <span class="spaces">ESPACIOS: 1/2</span>
                    <button class="componente-boton">UNIRSE</button>
                </div>
            </div>

            <div class="room-card componente-tarjeta">
                <img src="./imagenes/avatar2.jpg" alt="Avatar" class="avatar">
                <div class="room-info">
                    <span class="user-name">MyDarlingKano</span>
                    <span class="spaces">ESPACIOS: 2/2</span>
                    <button class="componente-boton" disabled>UNIRSE</button>
                </div>
            </div>
        </div>

        <a href="#" class="btn-siguiente-main">SIGUIENTE ></a>
    </main>

    <footer>
        <p>&copy; 2026 Yu-Gi-Oh! Templo de Duelo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
