<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duelos - Yu-Gi-Oh! Templo de Duelo</title>
    <style>
        @font-face {
            font-family: 'YuGiOhFont';
            src: url('./fuentes/Matrix-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-principal: #8D3824;
            --bg-header: rgba(60, 20, 10, 0.95);
            --bg-tarjeta: #3c140a;
            --color-dorado: #f3c653;
            --color-texto-suave: #e0d0b0;
            --color-blanco: #ffffff;
            --fuente-principal: 'YuGiOhFont', Arial, sans-serif;
            --sombra-texto: 1px 1px 2px rgba(0,0,0,0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background-color: var(--bg-principal);
            color: var(--color-dorado);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: var(--fuente-principal);
        }

        /* HEADER MOBILE-FIRST CON FLEXBOX */
        .duelos-header {
            width: 100%;
            background-color: var(--bg-header);
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--bg-tarjeta);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .duelos-header__logo { height: 40px; }

        .duelos-header nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .duelos-header__link {
            color: var(--color-dorado);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            text-shadow: var(--sombra-texto);
            transition: color 0.2s ease;
        }

        .duelos-header__link:hover, 
        .duelos-header__link.active {
            color: var(--color-blanco);
            text-decoration: underline;
        }

        /* MAIN Y CONTENIDO */
        .duelos-main {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .duelos-main__grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .room-card {
            background-color: var(--bg-tarjeta);
            border: 3px solid #200803;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .room-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: var(--color-dorado);
        }

        .room-card__avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #5a2412;
        }

        .room-card__info { display: flex; flex-direction: column; gap: 8px; }
        .room-card__name { font-size: 1.1rem; font-weight: bold; color: var(--color-dorado); letter-spacing: 0.5px; }
        .room-card__spaces { font-size: 0.9rem; color: var(--color-texto-suave); letter-spacing: 1px; text-transform: uppercase; }

        .room-card__btn {
            background-color: #5a2412;
            color: var(--color-dorado);
            padding: 8px 18px;
            border-radius: 12px;
            border: 2px solid #5a2412;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            text-shadow: var(--sombra-texto);
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            letter-spacing: 1px;
            display: inline-block;
            text-align: center;
            transition: all 0.2s ease;
        }

        .room-card__btn:hover {
            color: var(--color-blanco);
            transform: scale(1.05);
            background-color: #702e17;
        }

        .room-card__btn--disabled {
            background-color: #1a0804;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            pointer-events: none;
        }

        .duelos-main__btn-siguiente {
            background-color: var(--bg-tarjeta);
            color: var(--color-dorado);
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #5a2412;
            margin-top: 30px;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .duelos-footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            color: var(--color-dorado);
            background-color: var(--bg-header);
        }

        /* BREAKPOINT PARA ESCRITORIO (min-width: 820px) */
        @media (min-width: 820px) {
            .duelos-header {
                flex-direction: row;
                padding: 12px 30px;
            }
            .duelos-header__logo { height: 45px; }
            .duelos-header nav {
                gap: 20px;
            }
            .duelos-header__link {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header class="duelos-header">
        <a href="index.html"><img src="./imagenes/logo.png" alt="Yu-Gi-Oh!" class="duelos-header__logo"></a>
        <nav>
            <a href="cartas.html" class="duelos-header__link">CARTAS</a>
            <a href="duelos.html" class="duelos-header__link active">DUELOS</a>
            <a href="sucursal.html" class="duelos-header__link">SUCURSAL</a>
            <a href="registro.html" class="duelos-header__link">Registrarse / Iniciar sesión</a>
        </nav>
    </header>

    <main class="duelos-main">
        <div class="duelos-main__grid">
            <div class="room-card">
                <img src="./imagenes/avatar1.jpg" alt="Avatar" class="room-card__avatar">
                <div class="room-card__info">
                    <span class="room-card__name">MasterMiguel67</span>
                    <span class="room-card__spaces">ESPACIOS: 1/2</span>
                    <a href="mantenimiento.html" class="room-card__btn">UNIRSE</a>
                </div>
            </div>

            <div class="room-card">
                <img src="./imagenes/avatar2.jpg" alt="Avatar" class="room-card__avatar">
                <div class="room-card__info">
                    <span class="room-card__name">MyDarlingKano</span>
                    <span class="room-card__spaces">ESPACIOS: 2/2</span>
                    <a href="#" class="room-card__btn room-card__btn--disabled">UNIRSE</a>
                </div>
            </div>
        </div>

        <a href="#" class="duelos-main__btn-siguiente">SIGUIENTE ></a>
    </main>

    <footer class="duelos-footer">
        <p>&copy; 2026 Yu-Gi-Oh! Templo de Duelo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
