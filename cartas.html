<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartas - Yu-Gi-Oh! Templo de Duelo</title>
    <style>
        @font-face {
            font-family: 'YuGiOhFont';
            src: url('./fuentes/Matrix-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-principal: #8D3824;
            --bg-header: rgba(60, 20, 10, 0.95);
            --bg-tarjeta: #3c140a;
            --color-dorado: #f3c653;
            --color-texto-suave: #e0d0b0;
            --color-blanco: #ffffff;
            --fuente-principal: 'YuGiOhFont', Arial, sans-serif;
            --sombra-texto: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .componente-tarjeta {
            background-color: var(--bg-tarjeta);
            border: 3px solid #200803;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .componente-boton {
            background-color: #3c140a;
            color: var(--color-dorado);
            padding: 12px 24px;
            border-radius: 8px;
            border: 2px solid #5a2412;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            text-shadow: var(--sombra-texto);
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            cursor: pointer;
            font-family: var(--fuente-principal);
        }

        .componente-boton:hover {
            background-color: #5a2412;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background-color: var(--bg-principal);
            color: var(--color-dorado);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: var(--fuente-principal);
        }

        header {
            width: 100%;
            background-color: var(--bg-header);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-tarjeta);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-nav { height: 45px; width: auto; }
        nav a {
            color: var(--color-dorado);
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            text-shadow: var(--sombra-texto);
        }
        nav a.active, nav a:hover { color: var(--color-blanco); text-decoration: underline; }

        main {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-box { width: 100%; margin-bottom: 20px; }
        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 20px;
            border: 2px solid #200803;
            background-color: var(--bg-tarjeta);
            color: var(--color-dorado);
            font-size: 1rem;
            outline: none;
            letter-spacing: 1px;
        }
        .search-input::placeholder { color: #b8860b; }

        .card-list { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .card-img { width: 140px; height: auto; border-radius: 4px; object-fit: contain; }
        .card-info { flex: 1; display: flex; flex-direction: column; gap: 5px; font-size: 0.95rem; line-height: 1.4; }
        .card-title { font-size: 1.3rem; font-weight: bold; margin: 0 0 5px 0; color: var(--color-blanco); }
        .card-desc { flex: 2; padding-left: 15px; font-size: 0.95rem; line-height: 1.5; color: var(--color-texto-suave); }

        footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--color-dorado);
            background-color: var(--bg-header);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><img src="./imagenes/logo.png" alt="Yu-Gi-Oh!" class="logo-nav"></a>
        <nav>
            <a href="cartas.html" class="active">CARTAS</a>
            <a href="duelos.html">DUELOS</a>
            <a href="sucursal.html">SUCURSAL</a>
            <a href="registro.html">Registrarse / Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <div class="search-box">
            <input type="text" class="search-input" placeholder="🔍 BUSCAR CARTA">
        </div>

        <!-- Contenedor dinámico de las 4 cartas por página -->
        <div class="card-list" id="lista-cartas"></div>

        <button id="btn-siguiente-cartas" class="componente-boton" style="margin-top: 25px;">SIGUIENTE &gt;</button>
    </main>

    <footer>
        <p>&copy; 2026 Yu-Gi-Oh! Templo de Duelo. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Listado dividido en páginas de 4 cartas con las imágenes actualizadas
        const paginasCartas = [
            // Página 1 (4 cartas)
            [
                {
                    nombre: "Kuriboh",
                    tipo: "Oscuridad",
                    nivel: "1",
                    detalles: "Demonio/Efecto",
                    atk: "300",
                    def: "200",
                    desc: "Descarta esta carta de tu mano para hacer que el daño de batalla infligido por 1 monstruo de tu adversario a tus puntos de vida sea 0.",
                    imagen: "./imagenes/kuriboh.png"
                },
                {
                    nombre: "Chica Maga Aspirante",
                    tipo: "Oscuridad",
                    nivel: "1",
                    detalles: "Lanzador de Conjuros/Efecto",
                    atk: "500",
                    def: "200",
                    desc: "Cuando esta carta es Invocada: aplica estos efectos, en secuencia, dependiendo del número de 'Chica Maga Oscura' en tu lado del campo o Cementerio...",
                    imagen: "./imagenes/maga_oscura.png"
                },
                {
                    nombre: "Mago Oscuro",
                    tipo: "Oscuridad",
                    nivel: "7",
                    detalles: "Lanzador de Conjuros",
                    atk: "2500",
                    def: "2100",
                    desc: "El lanzador de conjuros definitivo en cuanto a ataque y defensa se refiere.",
                    imagen: "Mago_oscuro.png"
                },
                {
                    nombre: "Dragón Blanco de Ojos Azules",
                    tipo: "Luz",
                    nivel: "8",
                    detalles: "Dragón",
                    atk: "3000",
                    def: "2500",
                    desc: "Un dragón legendario de destrucción. Potente de forma innata, muy pocos han visto esta criatura y han vivido para contarlo.",
                    imagen: "Dragon_blanco_ojos_azules.png"
                }
            ],
            // Página 2 (4 cartas adicionales)
            [
                {
                    nombre: "Mago del Tiempo",
                    tipo: "Luz",
                    nivel: "2",
                    detalles: "Lanzador de Conjuros/Efecto",
                    atk: "500",
                    def: "400",
                    desc: "Una vez por turno: puedes lanzar una moneda y elegir Cara o Cruz. Si aciertas, destruye todos los monstruos que controle tu adversario.",
                    imagen: "Mago_tiempo.jpg"
                },
                {
                    nombre: "Cráneo Convocado",
                    tipo: "Oscuridad",
                    nivel: "6",
                    detalles: "Demonio",
                    atk: "2500",
                    def: "1200",
                    desc: "Un demonio con poderes oscuros para confundir al enemigo. Entre los monstruos de Tipo Demonio, este monstruo alardea de considerable fuerza.",
                    imagen: "Craneo_suma.jpg"
                },
                {
                    nombre: "Guerrero de Pizarra",
                    tipo: "Viento",
                    nivel: "4",
                    detalles: "Demonio / Efecto",
                    atk: "1900",
                    def: "400",
                    desc: "VOLTEO: Esta carta gana 500 ATK y DEF. Si esta carta es destruida en batalla: el monstruo que la destruyó pierde 500 ATK y DEF.",
                    imagen: "Guerrero_de_pizarra.jpg"
                },
                {
                    nombre: "Dragón Negro de Ojos Rojos",
                    tipo: "Oscuridad",
                    nivel: "7",
                    detalles: "Dragón",
                    atk: "2400",
                    def: "2000",
                    desc: "Un dragón feroz con un ataque mortal. Posee un potencial oculto incalculable.",
                    imagen: "Dragon_negro_ojos_rojos.jpg"
                }
            ]
        ];

        let paginaCartaActual = 0;

        function renderizarCartas() {
            const contenedor = document.getElementById('lista-cartas');
            contenedor.innerHTML = "";

            paginasCartas[paginaCartaActual].forEach(carta => {
                const item = document.createElement('div');
                item.className = "card-item componente-tarjeta";
                item.innerHTML = `
                    <img src="${carta.imagen}" alt="${carta.nombre}" class="card-img">
                    <div class="card-info">
                        <h2 class="card-title">${carta.nombre}</h2>
                        <div><strong>Tipo:</strong> ${carta.tipo}</div>
                        <div><strong>Nivel:</strong> ${carta.nivel}</div>
                        <div>${carta.detalles}</div>
                        <div><strong>ATK:</strong> ${carta.atk} <strong>DEF:</strong> ${carta.def}</div>
                    </div>
                    <div class="card-desc">
                        ${carta.desc}
                    </div>
                `;
                contenedor.appendChild(item);
            });
        }

        document.getElementById('btn-siguiente-cartas').addEventListener('click', () => {
            paginaCartaActual = (paginaCartaActual + 1) % paginasCartas.length;
            renderizarCartas();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Renderizado inicial
        renderizarCartas();
    </script>
</body>
</html>
